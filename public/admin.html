<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · GanaAds</title>
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5598441517366617" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">GanaAds Admin</div>
  </div>

  <div class="cta-row" style="margin-bottom:20px">
    <a href="dashboard.html" class="btn btn-ghost btn-lg" style="text-decoration:none; margin-top:0">Volver al panel</a>
    <button class="btn btn-ghost btn-lg" id="admin-logout-btn" style="margin-top:0">Salir</button>
  </div>

  <div class="admin-stats">
    <div class="stat-box">
      <div class="num" id="stat-total-users">—</div>
      <div class="label">Usuarios registrados</div>
    </div>
    <div class="stat-box">
      <div class="num" id="stat-pending">—</div>
      <div class="label">Retiros pendientes</div>
    </div>
    <div class="stat-box">
      <div class="num" id="stat-paid">—</div>
      <div class="label">Total pagado (USDT)</div>
    </div>
  </div>

  <h1>Retiros pendientes</h1>
  <p>Aprueba solo después de haber enviado el USDT manualmente a la billetera del usuario.</p>

  <div id="pending-list"></div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'auth.html';
const authHeaders = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };

document.getElementById('admin-logout-btn').addEventListener('click', () => {
  localStorage.removeItem('token');
  window.location.href = 'auth.html';
});

async function loadStats() {
  const res = await fetch('/api/admin/stats', { headers: authHeaders });
  if (!res.ok) return;
  const stats = await res.json();
  document.getElementById('stat-total-users').textContent = stats.totalUsers;
  document.getElementById('stat-pending').textContent = stats.pendingWithdrawals;
  document.getElementById('stat-paid').textContent = `$${stats.totalPaidUsdt}`;
}

async function load() {
  const res = await fetch('/api/withdrawals/pending', { headers: authHeaders });
  if (res.status === 403) {
    document.getElementById('pending-list').innerHTML =
      '<p class="error-msg show">No tienes permisos de administrador en esta cuenta.</p>';
    return;
  }
  const list = await res.json();
  const container = document.getElementById('pending-list');
  if (list.length === 0) {
    container.innerHTML = '<p class="muted">No hay retiros pendientes.</p>';
    return;
  }
  container.innerHTML = list.map(w => `
    <div class="card">
      <strong>${w.email}</strong>
      <p style="margin:6px 0">Monto: $${w.amount_usdt} USDT</p>
      <p style="margin:6px 0; word-break:break-all">Billetera: ${w.wallet_address}</p>
      <button class="btn btn-primary btn-lg" onclick="approve(${w.id})">Marcar como pagado</button>
      <button class="btn btn-ghost btn-lg" onclick="reject(${w.id})">Rechazar</button>
    </div>
  `).join('');
}

async function approve(id) {
  await fetch(`/api/withdrawals/${id}/approve`, { method: 'POST', headers: authHeaders });
  load();
  loadStats();
}
async function reject(id) {
  await fetch(`/api/withdrawals/${id}/reject`, { method: 'POST', headers: authHeaders });
  load();
  loadStats();
}

load();
loadStats();
</script>
</body>
</html>
