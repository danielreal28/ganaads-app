<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · GanaAds</title>
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5598441517366617" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">GanaAds Admin</div>
  </div>

  <div class="cta-row" style="margin-bottom:20px">
    <a href="dashboard.html" class="btn btn-ghost btn-lg" style="text-decoration:none; margin-top:0">Volver al panel</a>
    <button class="btn btn-ghost btn-lg" id="admin-logout-btn" style="margin-top:0">Salir</button>
  </div>

  <div class="admin-stats">
    <div class="stat-box">
      <div class="num" id="stat-total-users">—</div>
      <div class="label">Usuarios registrados</div>
    </div>
    <div class="stat-box">
      <div class="num" id="stat-pending">—</div>
      <div class="label">Retiros pendientes</div>
    </div>
    <div class="stat-box">
      <div class="num" id="stat-paid">—</div>
      <div class="label">Total pagado (USDT)</div>
    </div>
  </div>

  <div class="card">
    <h2>Ganancia real por anuncio (RPM)</h2>
    <p id="rpm-info">Cargando...</p>
    <label for="rpm-input">RPM actual reportado por AdSense (USDT por 1000 vistas)</label>
    <input type="number" id="rpm-input" step="0.01" min="0" placeholder="Ej: 2.50">
    <button class="btn btn-primary btn-lg" id="rpm-save-btn">Actualizar RPM</button>
    <div class="success-msg" id="rpm-success"></div>
  </div>

  <div class="card">
    <h2>Chat de soporte</h2>
    <div id="conversations-list" style="margin-bottom:14px;"></div>
    <div id="chat-view" style="display:none;">
      <button class="btn btn-ghost" id="back-to-list-btn" style="width:auto; margin:0 0 10px; padding:8px 14px;">← Volver a la lista</button>
      <div id="admin-chat-messages" style="max-height:300px; overflow-y:auto; margin-bottom:12px;"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="admin-chat-input" placeholder="Escribe tu respuesta...">
        <button class="btn btn-primary" id="admin-chat-send-btn" style="width:auto; margin:0; padding:12px 20px;">Enviar</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Usuarios <span id="online-count" style="color:var(--mint)"></span></h2>
    <div id="users-list"></div>
  </div>

  <h1>Retiros pendientes</h1>
  <p>Aprueba solo después de haber enviado el USDT manualmente a la billetera del usuario.</p>

  <div id="pending-list"></div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'auth.html';
const authHeaders = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };

document.getElementById('admin-logout-btn').addEventListener('click', () => {
  localStorage.removeItem('token');
  window.location.href = 'auth.html';
});

async function loadStats() {
  const res = await fetch('/api/admin/stats', { headers: authHeaders });
  if (!res.ok) return;
  const stats = await res.json();
  document.getElementById('stat-total-users').textContent = stats.totalUsers;
  document.getElementById('stat-pending').textContent = stats.pendingWithdrawals;
  document.getElementById('stat-paid').textContent = `US$${stats.totalPaidUsdt}`;
}

async function load() {
  const res = await fetch('/api/withdrawals/pending', { headers: authHeaders });
  if (res.status === 403) {
    document.getElementById('pending-list').innerHTML =
      '<p class="error-msg show">No tienes permisos de administrador en esta cuenta.</p>';
    return;
  }
  const list = await res.json();
  const container = document.getElementById('pending-list');
  if (list.length === 0) {
    container.innerHTML = '<p class="muted">No hay retiros pendientes.</p>';
    return;
  }
  container.innerHTML = list.map(w => `
    <div class="card">
      <strong>${w.email}</strong>
      <p style="margin:6px 0">Monto: US$${w.amount_usdt} USDT</p>
      <p style="margin:6px 0; word-break:break-all">Billetera: ${w.wallet_address}</p>
      <button class="btn btn-primary btn-lg" onclick="approve(${w.id})">Marcar como pagado</button>
      <button class="btn btn-ghost btn-lg" onclick="reject(${w.id})">Rechazar</button>
    </div>
  `).join('');
}

async function approve(id) {
  await fetch(`/api/withdrawals/${id}/approve`, { method: 'POST', headers: authHeaders });
  load();
  loadStats();
}
async function reject(id) {
  await fetch(`/api/withdrawals/${id}/reject`, { method: 'POST', headers: authHeaders });
  load();
  loadStats();
}

async function loadRpmSettings() {
  const res = await fetch('/api/admin/settings', { headers: authHeaders });
  if (!res.ok) return;
  const s = await res.json();
  const rpmText = s.currentRpmUsdt !== null
    ? `RPM configurado: US$${s.currentRpmUsdt} por 1000 vistas. Actualmente pagando ${s.currentPointsPerAd} puntos por anuncio (margen ${s.marginPercent}%).`
    : `Aun no has configurado un RPM real. Usando valor conservador: US$${s.fallbackRpmUsdt} por 1000 vistas (${s.currentPointsPerAd} puntos por anuncio).`;
  document.getElementById('rpm-info').textContent = rpmText;
  if (s.currentRpmUsdt !== null) {
    document.getElementById('rpm-input').value = s.currentRpmUsdt;
  }
}

document.getElementById('rpm-save-btn').addEventListener('click', async () => {
  const rpmUsdt = document.getElementById('rpm-input').value;
  const res = await fetch('/api/admin/settings', {
    method: 'POST',
    headers: authHeaders,
    body: JSON.stringify({ rpmUsdt }),
  });
  const data = await res.json();
  const successBox = document.getElementById('rpm-success');
  if (res.ok) {
    successBox.textContent = `Guardado. Ahora se pagan ${data.newPointsPerAd} puntos por anuncio.`;
    successBox.classList.add('show');
    loadRpmSettings();
  } else {
    alert(data.error || 'No se pudo guardar.');
  }
});

let currentChatUserId = null;

async function loadConversations() {
  const res = await fetch('/api/support/conversations', { headers: authHeaders });
  const conversations = await res.json();
  const container = document.getElementById('conversations-list');

  if (conversations.length === 0) {
    container.innerHTML = '<p class="muted">Aún no hay mensajes de soporte.</p>';
    return;
  }

  container.innerHTML = conversations.map((c) => `
    <div class="list-item" style="cursor:pointer" onclick="openConversation(${c.user_id}, '${c.email}')">
      <div>${c.email}</div>
      ${c.unread_count > 0 ? `<span class="badge badge-pending">${c.unread_count} nuevo(s)</span>` : ''}
    </div>
  `).join('');
}

async function openConversation(userId, email) {
  currentChatUserId = userId;
  document.getElementById('conversations-list').style.display = 'none';
  document.getElementById('chat-view').style.display = 'block';
  await loadAdminChatMessages();
}

async function loadAdminChatMessages() {
  const res = await fetch(`/api/support/conversation/${currentChatUserId}`, { headers: authHeaders });
  const messages = await res.json();
  const container = document.getElementById('admin-chat-messages');

  container.innerHTML = messages.map((m) => {
    const isAdmin = m.sender === 'admin';
    return `
      <div style="margin-bottom:10px; display:flex; ${isAdmin ? 'justify-content:flex-end' : 'justify-content:flex-start'}">
        <div style="max-width:75%; padding:10px 14px; border-radius:12px; background:${isAdmin ? 'var(--mint)' : 'var(--bg-panel-raised)'}; color:${isAdmin ? '#06231B' : 'var(--text)'};">
          <div style="font-size:0.85rem;">${m.message}</div>
        </div>
      </div>
    `;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

document.getElementById('back-to-list-btn').addEventListener('click', () => {
  currentChatUserId = null;
  document.getElementById('conversations-list').style.display = 'block';
  document.getElementById('chat-view').style.display = 'none';
  loadConversations();
});

document.getElementById('admin-chat-send-btn').addEventListener('click', async () => {
  const input = document.getElementById('admin-chat-input');
  const message = input.value.trim();
  if (!message || !currentChatUserId) return;

  input.value = '';
  await fetch(`/api/support/reply/${currentChatUserId}`, {
    method: 'POST',
    headers: authHeaders,
    body: JSON.stringify({ message }),
  });
  await loadAdminChatMessages();
});

document.getElementById('admin-chat-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('admin-chat-send-btn').click();
  }
});

async function loadUsersList() {
  const res = await fetch('/api/admin/users', { headers: authHeaders });
  const users = await res.json();
  const online = users.filter(u => u.is_online).length;
  document.getElementById('online-count').textContent = `(${online} en linea ahora)`;

  document.getElementById('users-list').innerHTML = users.map(u => {
    const dotColor = u.is_online ? 'var(--mint)' : 'var(--text-dim)';
    const lastSeen = u.last_active_at
      ? new Date(u.last_active_at).toLocaleString()
      : 'Nunca';
    return `
      <div class="list-item">
        <div>
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${dotColor}; margin-right:8px;"></span>
          ${u.email}
          <div class="muted">Ultima actividad: ${lastSeen}</div>
        </div>
      </div>
    `;
  }).join('');
}

load();
loadStats();
loadRpmSettings();
loadConversations();
loadUsersList();
setInterval(loadUsersList, 15000);
</script>
</body>
</html>
