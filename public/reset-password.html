<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — GanaAds</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">GanaAds</div>
  </div>

  <h1>Crea tu nueva contraseña</h1>
  <p>Escribe tu nueva contraseña para tu cuenta.</p>

  <div class="card">
    <form id="reset-form">
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">

      <button type="submit" class="btn btn-primary" id="submit-btn">Guardar nueva contraseña</button>
      <div class="error-msg" id="error-box"></div>
      <div class="success-msg" id="success-box"></div>
    </form>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const form = document.getElementById('reset-form');
const errorBox = document.getElementById('error-box');
const successBox = document.getElementById('success-box');
const submitBtn = document.getElementById('submit-btn');

if (!token) {
  errorBox.textContent = 'Este enlace no es válido. Solicita uno nuevo desde la pantalla de recuperar contraseña.';
  errorBox.classList.add('show');
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Guardando...';

  const newPassword = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.error || 'Algo salió mal. Intenta de nuevo.';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Guardar nueva contraseña';
    } else {
      successBox.textContent = '¡Contraseña actualizada! Ya puedes iniciar sesión.';
      successBox.classList.add('show');
      form.style.display = 'none';
      setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
    }
  } catch (err) {
    errorBox.textContent = 'No se pudo conectar con el servidor.';
    errorBox.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Guardar nueva contraseña';
  }
});
</script>

</body>
</html>
