<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — GanaAds</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">GanaAds</div>
  </div>

  <h1>Recuperar contraseña</h1>
  <p>Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>

  <div class="card">
    <form id="forgot-form">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required placeholder="tucorreo@ejemplo.com">

      <button type="submit" class="btn btn-primary" id="submit-btn">Enviar enlace</button>
      <div class="error-msg" id="error-box"></div>
      <div class="success-msg" id="success-box"></div>
    </form>

    <div class="switch-link">
      <a href="auth.html">Volver a iniciar sesión</a>
    </div>
  </div>

</div>

<script>
const form = document.getElementById('forgot-form');
const errorBox = document.getElementById('error-box');
const successBox = document.getElementById('success-box');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  const email = document.getElementById('email').value.trim();

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.error || 'Algo salió mal. Intenta de nuevo.';
      errorBox.classList.add('show');
    } else {
      successBox.textContent = data.message;
      successBox.classList.add('show');
      form.reset();
    }
  } catch (err) {
    errorBox.textContent = 'No se pudo conectar con el servidor.';
    errorBox.classList.add('show');
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Enviar enlace';
});
</script>

</body>
</html>
